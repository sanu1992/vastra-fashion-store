name: Build, validate and publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/fashion-store/**"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vastra-build-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Scan, build, validate and publish

    runs-on:
      - self-hosted
      - Linux
      - X64
      - storage-01
      - podman
      - zot

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate runner
        run: |
          podman info \
            --format 'rootless={{.Host.Security.Rootless}} runtime={{.Host.OCIRuntime.Name}}'

      - name: Scan repository for secrets
        run: |
          podman run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro,Z" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect \
            --source=/repo \
            --redact \
            --verbose

      - name: Define image references
        id: image
        env:
          ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
        run: |
          if [ -z "$ZOT_REGISTRY" ]; then
            echo "Repository variable ZOT_REGISTRY is not configured."
            exit 1
          fi

          IMAGE_TAG="${GITHUB_SHA:0:12}"
          SHA_IMAGE="${ZOT_REGISTRY}/vastra/fashion-store:${IMAGE_TAG}"
          LATEST_IMAGE="${ZOT_REGISTRY}/vastra/fashion-store:latest"

          echo "sha_image=$SHA_IMAGE" >> "$GITHUB_OUTPUT"
          echo "latest_image=$LATEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Zot registry
        env:
          ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
          ZOT_USERNAME: ${{ secrets.ZOT_USERNAME }}
          ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
        run: |
          printf '%s' "$ZOT_PASSWORD" |
            podman login "$ZOT_REGISTRY" \
              --username "$ZOT_USERNAME" \
              --password-stdin

      - name: Build application image
        env:
          SHA_IMAGE: ${{ steps.image.outputs.sha_image }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest_image }}
        run: |
          podman build \
            --pull=missing \
            --tag "$SHA_IMAGE" \
            --tag "$LATEST_IMAGE" \
            --file Containerfile \
            .

      - name: Validate Django application
        env:
          SHA_IMAGE: ${{ steps.image.outputs.sha_image }}
        run: |
          podman run --rm \
            --entrypoint python \
            --env POSTGRES_DB=ci_check \
            --env POSTGRES_USER=ci_check \
            --env POSTGRES_PASSWORD=ci_check \
            --env POSTGRES_HOST=127.0.0.1 \
            --env POSTGRES_PORT=5432 \
            --env REDIS_PASSWORD=ci_check \
            --env REDIS_HOST=127.0.0.1 \
            --env REDIS_PORT=6379 \
            --env REDIS_DB=1 \
            --env CELERY_REDIS_DB=2 \
            --env RABBITMQ_USER=ci_check \
            --env RABBITMQ_PASSWORD=ci_check \
            --env RABBITMQ_HOST=127.0.0.1 \
            --env RABBITMQ_PORT=5672 \
            --env RABBITMQ_VHOST=vastra \
            "$SHA_IMAGE" \
            manage.py check

      - name: Push immutable image
        env:
          SHA_IMAGE: ${{ steps.image.outputs.sha_image }}
        run: |
          podman push "$SHA_IMAGE"

      - name: Push latest image
        env:
          LATEST_IMAGE: ${{ steps.image.outputs.latest_image }}
        run: |
          podman push "$LATEST_IMAGE"

      - name: Update GitOps image reference
        env:
          SHA_IMAGE: ${{ steps.image.outputs.sha_image }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          mapfile -t IMAGE_FILES < <(
            grep -rlE \
              'image:[[:space:]]+[^[:space:]]*/vastra/fashion-store:' \
              deploy/fashion-store \
              --include='*.yaml' \
              --include='*.yml'
          )

          if [ "${#IMAGE_FILES[@]}" -eq 0 ]; then
            echo "No Vastra image references found."
            exit 1
          fi

          sed -i -E \
            "s#(^[[:space:]]*image:[[:space:]]+)[^[:space:]]*/vastra/fashion-store:[^[:space:]]+#\1${SHA_IMAGE}#g" \
            "${IMAGE_FILES[@]}"

          if git diff --quiet -- deploy/fashion-store; then
            echo "GitOps image reference is already current."
            exit 0
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/fashion-store

          git commit \
            --message "deploy image ${IMAGE_TAG} [skip ci]"

          git pull \
            --rebase \
            origin main

          git push \
            origin HEAD:main

      - name: Logout from Zot registry
        if: always()
        env:
          ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
        run: |
          if [ -n "$ZOT_REGISTRY" ]; then
            podman logout "$ZOT_REGISTRY" || true
          fi
