apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: fashion-store
  labels:
    app: celery-worker

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: celery-worker

  template:
    metadata:
      labels:
        app: celery-worker

    spec:
      terminationGracePeriodSeconds: 60

      imagePullSecrets:
        - name: zot-registry-credentials

      containers:
        - name: celery-worker
          image: registry.local:5000/vastra/fashion-store:latest
          imagePullPolicy: IfNotPresent

          command:
            - celery

          args:
            - -A
            - fashion_store
            - worker
            - --loglevel=INFO
            - --concurrency=1
            - --max-tasks-per-child=100
            - --without-gossip
            - --without-mingle

          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "fashion_store.settings"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fashion-store-db
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fashion-store-db
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-store-db
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_HOST
              value: "postgres"

            - name: POSTGRES_PORT
              value: "5432"

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-store-redis
                  key: REDIS_PASSWORD

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            - name: REDIS_DB
              value: "1"

            - name: CELERY_REDIS_DB
              value: "2"

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: fashion-store-rabbitmq
                  key: RABBITMQ_DEFAULT_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-store-rabbitmq
                  key: RABBITMQ_DEFAULT_PASS

            - name: RABBITMQ_VHOST
              valueFrom:
                secretKeyRef:
                  name: fashion-store-rabbitmq
                  key: RABBITMQ_DEFAULT_VHOST

            - name: RABBITMQ_HOST
              value: "rabbitmq"

            - name: RABBITMQ_PORT
              value: "5672"

            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fashion-store-ai
                  key: AI_API_KEY

            - name: AI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: fashion-store-ai
                  key: AI_BASE_URL

            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: fashion-store-ai
                  key: AI_MODEL

            - name: UNSPLASH_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fashion-store-images
                  key: UNSPLASH_ACCESS_KEY

          resources:
            requests:
              cpu: 100m
              memory: 192Mi

            limits:
              cpu: 500m
              memory: 384Mi
