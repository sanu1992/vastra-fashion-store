apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: fashion-store
  labels:
    app: redis
    component: cache

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis
        component: cache

    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          imagePullPolicy: IfNotPresent

          args:
            - redis-server
            - --appendonly
            - "no"
            - --save
            - ""
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-store-redis
                  key: REDIS_PASSWORD

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: fashion-store
  labels:
    app: redis
    component: cache

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
