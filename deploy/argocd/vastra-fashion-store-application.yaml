apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: vastra-fashion-store
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:sanu1992/vastra-fashion-store.git
    targetRevision: main
    path: deploy/fashion-store

  destination:
    server: https://kubernetes.default.svc
    namespace: fashion-store
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
